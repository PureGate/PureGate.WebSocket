name: publish

# Publishes the version set in Directory.Build.props (NuGet) and packages/web-socket/package.json (npm), when you run
# it from the Actions tab. Both registries use trusted publishing, so no API key is stored here. Before the first run:
# - on nuget.org, add a trusted publishing policy for this repository and publish.yml, and set the repository
#   variable NUGET_USER to the nuget.org account that owns the package;
# - on npmjs.com, add this repository and publish.yml as the package's trusted publisher.
# Publishing a version that is already there fails, so a forgotten version change cannot pass unnoticed.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to publish
        type: choice
        options: [both, nuget, npm]
        default: both

# Bash on every runner, so a failing command fails its step there too.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  nuget:
    if: inputs.target != 'npm'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Trusted publishing exchanges the workflow's identity for a short-lived NuGet key.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build PureGate.WebSocket.slnx -c Release

      - name: Test
        run: dotnet test src/PureGate.WebSocket.Test -c Release --no-build --blame-hang-timeout 2m

      - name: Pack
        run: dotnet pack src/PureGate.WebSocket -c Release --no-build -o artifacts/packages

      - name: Sign in to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The symbols package next to it goes up with it.
      - name: Publish
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  npm:
    if: inputs.target != 'nuget'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Trusted publishing, which also gives the package its provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # The integration tests run against the .NET TestServer.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      # Node 25 and later no longer ship Corepack, which provides the Yarn version package.json pins.
      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Check
        run: |
          yarn check
          yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Size budget
        run: yarn workspace @puregate/web-socket size

      - name: Pack
        run: yarn workspace @puregate/web-socket pack --out "$GITHUB_WORKSPACE/artifacts/web-socket.tgz"

      # Trusted publishing needs a recent npm CLI.
      - name: Publish
        run: |
          npm install --global npm@latest
          npm publish "$GITHUB_WORKSPACE/artifacts/web-socket.tgz" --access public
